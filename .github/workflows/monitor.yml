name: BTC 盯盘提醒

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行盯盘脚本
        env:
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          # 想只发测试消息, 把下面一行最前面的 # 删掉:
          TEST_MSG: "1"
        run: python btc_monitor.py

      - name: 保存状态与心跳(失败也不影响)
        continue-on-error: true
        run: |
          date -u +%Y-%m-%d > heartbeat.txt || true
          if [ -n "$(git status --porcelain state.json heartbeat.txt)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add state.json heartbeat.txt
            git commit -m "update state & heartbeat [skip ci]" || true
            git push || echo "推送被拒(写权限未开)，已跳过，不影响盯盘与提醒。"
          else
            echo "无变化, 无需提交。"
          fi
